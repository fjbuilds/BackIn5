<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Payment - BackIn5</title>
  <meta name="description" content="Complete your BackIn5 setup - we'll have you live within 48 hours." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0E1116;
      color: #EAECF1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .pay-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1B212B;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .pay-bar a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .pay-bar a:hover { color: #fff; }
    .pay-bar img { height: 22px; width: auto; display: block; }

    .pay-wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }
    .pay-eyebrow {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(234,236,241,0.55);
      margin-bottom: 12px;
    }
    h1 {
      font-weight: 700;
      font-size: clamp(26px, 5vw, 34px);
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
      color: #fff;
    }
    .pay-lead {
      font-size: 16px;
      line-height: 1.55;
      color: rgba(234,236,241,0.7);
      margin: 0 0 16px;
    }
    .pay-note {
      font-size: 13.5px;
      line-height: 1.5;
      color: rgba(234,236,241,0.6);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 14px;
      margin: 0 0 28px;
    }
    .pay-note strong { color: #fff; }

    .summary {
      background: #171B22;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 24px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .summary-row:last-child { border-bottom: 0; }
    .summary-row .label {
      font-size: 13px;
      color: rgba(234,236,241,0.55);
      letter-spacing: 0.02em;
    }
    .summary-row .value {
      font-size: 15px;
      color: #fff;
      font-weight: 600;
      text-align: right;
    }
    .summary-row.total .label { color: rgba(234,236,241,0.85); font-size: 14px; }
    .summary-row.total .value { font-size: 22px; color: #fff; letter-spacing: -0.01em; }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #2341A8;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      padding: 16px 28px;
      border-radius: 100px;
      border: 0;
      cursor: pointer;
      transition: background 140ms ease;
    }
    .cta:hover { background: #1c378f; }
    .cta[data-disabled="true"] { cursor: not-allowed; }
    .cta-note {
      margin: 14px 0 0;
      text-align: center;
      font-size: 12.5px;
      color: rgba(234,236,241,0.5);
    }

    .commit-box {
      background: rgba(35,65,168,0.08);
      border: 1px solid rgba(35,65,168,0.35);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .commit-line {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer;
      font-size: 13.5px;
      line-height: 1.5;
      color: rgba(234,236,241,0.85);
    }
    .commit-line input[type="checkbox"] {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 1px;
      accent-color: #2341A8;
      cursor: pointer;
    }
    .commit-line a {
      color: #93A9E7;
      text-decoration: underline;
    }
    .commit-line a:hover { color: #fff; }
    .commit-line strong { color: #fff; }

    .next-steps {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .next-steps h3 {
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(234,236,241,0.55);
      margin: 0 0 14px;
      font-weight: 600;
    }
    .next-steps ol {
      margin: 0;
      padding-left: 20px;
      color: rgba(234,236,241,0.78);
      font-size: 14px;
      line-height: 1.7;
    }
    .next-steps ol li { margin-bottom: 6px; }
    .next-steps strong { color: #fff; }

    .pay-meta {
      margin-top: 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      justify-content: center;
      font-size: 12.5px;
      color: rgba(234,236,241,0.5);
    }
    .pay-meta a {
      color: rgba(234,236,241,0.7);
      text-decoration: underline;
    }
    .pay-meta a:hover { color: #fff; }

    .fallback h1 { color: #fff; }
    .fallback .summary { display: none; }

    /* ── Plan picker (shown when no ?plan= in URL) ── */
    .pick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    @media (max-width: 520px) {
      .pick-grid { grid-template-columns: 1fr; }
    }
    .pick-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      background: #171B22;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: border-color 140ms ease, transform 140ms ease, background 140ms ease;
    }
    .pick-card:hover {
      border-color: #2341A8;
      background: #1B212B;
      transform: translateY(-1px);
    }
    .pick-card-head { display: flex; flex-direction: column; gap: 2px; }
    .pick-card-tier {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .pick-card-term {
      font-size: 12px;
      color: rgba(234,236,241,0.55);
    }
    .pick-card-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .pick-card-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: rgba(234,236,241,0.7);
    }
    .pick-card-row strong { color: #fff; font-weight: 600; }
    .pick-card-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #2341A8;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      padding: 11px 16px;
      border-radius: 100px;
    }
    .pick-card:hover .pick-card-cta { background: #1c378f; }
  </style>
</head>
<body>
  <div class="pay-bar">
    <a href="index.html"><img src="assets/backin5-logo-v4.png" alt="BackIn5" /></a>
    <a href="index.html">← Back to site</a>
  </div>

  <main class="pay-wrap" id="pay-wrap">
    <!-- Filled by JS based on ?plan= -->
  </main>

  <script>
    // ─── Plan config ──────────────────────────────────────────────
    // Update these URLs when you go live (copy each link in Stripe
    // via ··· → Copy to live mode, then paste the new URLs here).
    const PLANS = {
      smart_3mo: {
        tier: 'Smart Enquiry Handling',
        monthly: '£199 / month',
        term: 'Monthly rolling (3+ months)',
        dueNow: '£99 setup fee',
        dueNowAmount: 99,
        payLink: 'https://buy.stripe.com/4gM9AT7bb4D308Fa9Z08g02',
      },
      smart_6mo: {
        tier: 'Smart Enquiry Handling',
        monthly: '£199 / month',
        term: '6-month commitment',
        dueNow: '£0 today — card on file, billing starts after onboarding',
        dueNowAmount: 0,
        // 6-month customers go to the monthly subscription link with a trial
        // attached in Stripe. Card captured today, £0 charged, billing starts
        // when the trial ends (you control trial length in Stripe dashboard).
        payLink: 'https://buy.stripe.com/dRmfZh677glL5sZdmb08g01',
        commitsTo6Months: true,
      },
      full_3mo: {
        tier: 'Full Inbound Desk',
        monthly: '£349 / month',
        term: 'Monthly rolling (3+ months)',
        dueNow: '£149 setup fee',
        dueNowAmount: 149,
        payLink: 'https://buy.stripe.com/fZubJ16774D31cJ3LB08g03',
      },
      full_6mo: {
        tier: 'Full Inbound Desk',
        monthly: '£349 / month',
        term: '6-month commitment',
        dueNow: '£0 today — card on file, billing starts after onboarding',
        dueNowAmount: 0,
        payLink: 'https://buy.stripe.com/dRm9AT2UV4D3cVr0zp08g00',
        commitsTo6Months: true,
      },
    };

    // ─── Detect plan from URL ─────────────────────────────────────
    // Accepts:
    //  1. Clean keys: ?plan=smart_3mo / smart_6mo / full_3mo / full_6mo
    //  2. The raw label text from Tally, e.g.
    //     ?plan=Tier+1+-+3%2B+months+-+%C2%A3199%2Fmo+%2B+%C2%A399+setup+fee
    function detectPlanKey(raw) {
      if (!raw) return null;
      const lc = raw.toLowerCase();
      // Direct match against PLANS keys
      if (PLANS[lc]) return lc;
      // Pattern-match the Tally label
      const isTier1 = lc.includes('tier 1') || lc.includes('£199') || lc.includes('199/mo');
      const isTier2 = lc.includes('tier 2') || lc.includes('£349') || lc.includes('349/mo');
      const is6mo   = lc.includes('6+ months') || lc.includes('6 month') || lc.includes('6-month') || lc.includes('£0 setup');
      const is3mo   = lc.includes('3+ months') || lc.includes('3 month') || lc.includes('3-month');
      if (isTier1 && is6mo) return 'smart_6mo';
      if (isTier1 && is3mo) return 'smart_3mo';
      if (isTier2 && is6mo) return 'full_6mo';
      if (isTier2 && is3mo) return 'full_3mo';
      return null;
    }

    const params = new URLSearchParams(window.location.search);
    const planKey = detectPlanKey(params.get('plan'));
    const plan = planKey ? PLANS[planKey] : null;
    const wrap = document.getElementById('pay-wrap');

    if (!plan) {
      // No plan in URL — show the 4 options as cards so the customer can pick
      const card = (key, p) => {
        const isFree = p.dueNowAmount === 0;
        // 6-month customers (isFree) and setup-fee customers both go to Stripe;
        // payLink is set for both in PLANS. We just append plan as a hint.
        const href = `payment.html?plan=${key}`;
        const cta  = isFree ? 'Add card on file →' : `Pay £${p.dueNowAmount} →`;
        return `
          <a class="pick-card" href="${href}">
            <div class="pick-card-head">
              <div class="pick-card-tier">${p.tier}</div>
              <div class="pick-card-term">${p.term}</div>
            </div>
            <div class="pick-card-body">
              <div class="pick-card-row"><span>Monthly</span><strong>${p.monthly}</strong></div>
              <div class="pick-card-row"><span>Due now</span><strong>${isFree ? '£0' : '£' + p.dueNowAmount}</strong></div>
            </div>
            <span class="pick-card-cta">${cta}</span>
          </a>`;
      };
      wrap.innerHTML = `
        <div class="pay-eyebrow">Step 2 of 2 · Confirm your plan</div>
        <h1>Which plan did you sign up for?</h1>
        <p class="pay-lead">
          Tap the plan you chose on the form to complete your setup.
          Monthly billing only starts once your dashboard is live.
        </p>
        <div class="pick-grid">
          ${card('smart_3mo', PLANS.smart_3mo)}
          ${card('smart_6mo', PLANS.smart_6mo)}
          ${card('full_3mo',  PLANS.full_3mo)}
          ${card('full_6mo',  PLANS.full_6mo)}
        </div>
      `;
    } else if (plan.dueNowAmount === 0) {
      // 6-month commitment — no setup fee; capture card on file via Stripe
      // (the linked Payment Link should have a free trial period set in Stripe
      // so £0 is charged today and billing starts when you end the trial).
      wrap.innerHTML = `
        <div class="pay-eyebrow">Step 2 of 2 · Confirm 6-month commitment</div>
        <h1>£0 today — card on file only.</h1>
        <p class="pay-lead">
          You've chosen the <strong>6-month commitment</strong> on
          <strong>${plan.tier}</strong> — your setup fee is waived in exchange
          for the 6-month minimum term. We capture your card now but don't
          charge it today. Billing only starts once your dashboard is set up
          and you've signed off.
        </p>
        <p class="pay-note">
          <strong>Heads up</strong> — on the next page, Stripe will hold £0
          on your card while we build your dashboard. You won't be charged
          today. Billing only starts once your dashboard is live and you've
          signed off.
        </p>

        <div class="summary">
          <div class="summary-row">
            <span class="label">Plan</span>
            <span class="value">${plan.tier}</span>
          </div>
          <div class="summary-row">
            <span class="label">Term</span>
            <span class="value">${plan.term}</span>
          </div>
          <div class="summary-row">
            <span class="label">Monthly (starts after onboarding)</span>
            <span class="value">${plan.monthly}</span>
          </div>
          <div class="summary-row total">
            <span class="label">Charged today</span>
            <span class="value">£0</span>
          </div>
        </div>

        <div class="commit-box">
          <label class="commit-line">
            <input type="checkbox" id="commit-check" />
            <span>
              I confirm I'm committing to a <strong>6-month minimum term</strong>
              at ${plan.monthly}. The waived setup fee and remaining monthly
              fees are due if I cancel early, per the
              <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a>.
            </span>
          </label>
        </div>

        <a class="cta" id="commit-cta" href="${plan.payLink}" data-disabled="true">
          Add card on file →
        </a>
        <p class="cta-note">Secured by Stripe. £0 charged today.</p>

        <div class="next-steps">
          <h3>What happens next</h3>
          <ol>
            <li>Add your card — <strong>no charge today</strong>, card stored securely with Stripe.</li>
            <li>We <strong>configure your dashboard</strong> and embed the Quote Assistant on your site within 48 hours.</li>
            <li>You'll get a <strong>walkthrough call</strong> to confirm everything is set up exactly how you want it.</li>
            <li>Once you sign off, your <strong>${plan.monthly}</strong> billing starts automatically on the card we've stored.</li>
          </ol>
        </div>
      `;
    } else {
      // Monthly rolling — pay setup fee now via Stripe
      wrap.innerHTML = `
        <div class="pay-eyebrow">Step 2 of 2 · Setup fee</div>
        <h1>One-off setup fee, then you're done.</h1>
        <p class="pay-lead">
          Pay your setup fee below and we'll get your dashboard built within
          48 hours. Monthly billing starts only once your setup is complete
          and you've signed off — not today.
        </p>

        <div class="summary">
          <div class="summary-row">
            <span class="label">Plan</span>
            <span class="value">${plan.tier}</span>
          </div>
          <div class="summary-row">
            <span class="label">Term</span>
            <span class="value">${plan.term}</span>
          </div>
          <div class="summary-row">
            <span class="label">Monthly (starts after onboarding)</span>
            <span class="value">${plan.monthly}</span>
          </div>
          <div class="summary-row total">
            <span class="label">Due now</span>
            <span class="value">£${plan.dueNowAmount}</span>
          </div>
        </div>

        <div class="commit-box">
          <label class="commit-line">
            <input type="checkbox" id="commit-check" />
            <span>
              I confirm I'm signing up for <strong>${plan.tier}</strong> at
              ${plan.monthly} with a 3-month minimum term, and agree to the
              <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a>.
            </span>
          </label>
        </div>

        <a class="cta" id="commit-cta" href="${plan.payLink}" data-disabled="true">
          Pay £${plan.dueNowAmount} setup fee →
        </a>
        <p class="cta-note">Secured by Stripe. You'll get a receipt by email.</p>

        <div class="next-steps">
          <h3>What happens next</h3>
          <ol>
            <li>Pay the setup fee — takes about 30 seconds.</li>
            <li>We <strong>configure your dashboard</strong> and embed the Quote Assistant on your site within 48 hours.</li>
            <li>You'll get a <strong>walkthrough call</strong> to confirm everything is set up exactly how you want it.</li>
            <li>Once you sign off, your <strong>${plan.monthly}</strong> billing starts.</li>
          </ol>
        </div>
      `;
    }

    // Wire up the consent checkbox to enable/disable the CTA button
    // (only present when a plan was matched and a payment step is shown)
    const check = document.getElementById('commit-check');
    const cta   = document.getElementById('commit-cta');
    if (check && cta) {
      const update = () => {
        if (check.checked) {
          cta.removeAttribute('data-disabled');
          cta.style.opacity = '1';
          cta.style.pointerEvents = 'auto';
        } else {
          cta.setAttribute('data-disabled', 'true');
          cta.style.opacity = '0.5';
          cta.style.pointerEvents = 'none';
        }
      };
      check.addEventListener('change', update);
      update();
    }

    // Footer meta (always shown)
    const meta = document.createElement('div');
    meta.className = 'pay-meta';
    meta.innerHTML = `
      <span>Secured by Stripe</span>
      <span>•</span>
      <a href="terms.html" target="_blank" rel="noopener">Terms</a>
      <a href="privacy.html" target="_blank" rel="noopener">Privacy</a>
      <a href="mailto:hello@backin5.org">Contact</a>
    `;
    wrap.appendChild(meta);
  </script>
</body>
</html>
