<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Continue Your Trial - BackIn5</title>
  <meta name="description" content="Continue with BackIn5 after your free trial. No setup fee, monthly rolling." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0E1116;
      color: #EAECF1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .pay-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1B212B;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .pay-bar a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .pay-bar a:hover { color: #fff; }
    .pay-bar img { height: 22px; width: auto; display: block; }

    .pay-wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }
    .pay-eyebrow {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(234,236,241,0.55);
      margin-bottom: 12px;
    }
    h1 {
      font-weight: 700;
      font-size: clamp(26px, 5vw, 34px);
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
      color: #fff;
    }
    .pay-lead {
      font-size: 16px;
      line-height: 1.55;
      color: rgba(234,236,241,0.7);
      margin: 0 0 16px;
    }
    .pay-note {
      font-size: 13.5px;
      line-height: 1.5;
      color: rgba(234,236,241,0.6);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 14px;
      margin: 0 0 28px;
    }
    .pay-note strong { color: #fff; }

    .summary {
      background: #171B22;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .summary-row:last-child { border-bottom: 0; }
    .summary-row .label {
      font-size: 13px;
      color: rgba(234,236,241,0.55);
      letter-spacing: 0.02em;
    }
    .summary-row .value {
      font-size: 15px;
      color: #fff;
      font-weight: 600;
      text-align: right;
    }
    .summary-row.total .label { color: rgba(234,236,241,0.85); font-size: 14px; }
    .summary-row.total .value { font-size: 22px; color: #fff; letter-spacing: -0.01em; }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #2341A8;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      padding: 16px 28px;
      border-radius: 100px;
      border: 0;
      cursor: pointer;
      transition: background 140ms ease;
    }
    .cta:hover { background: #1c378f; }
    .cta[data-disabled="true"] { cursor: not-allowed; }
    .cta-note {
      margin: 14px 0 0;
      text-align: center;
      font-size: 12.5px;
      color: rgba(234,236,241,0.5);
    }

    .commit-box {
      background: rgba(35,65,168,0.07);
      border: 1px solid rgba(35,65,168,0.3);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .commit-line {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer;
      font-size: 13.5px;
      line-height: 1.5;
      color: rgba(234,236,241,0.85);
    }
    .commit-line input[type="checkbox"] {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 1px;
      accent-color: #2341A8;
      cursor: pointer;
    }
    .commit-line a {
      color: #93A9E7;
      text-decoration: underline;
    }
    .commit-line a:hover { color: #fff; }
    .commit-line strong { color: #fff; }

    .next-steps {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .next-steps h3 {
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(234,236,241,0.55);
      margin: 0 0 14px;
      font-weight: 600;
    }
    .next-steps ol {
      margin: 0;
      padding-left: 20px;
      color: rgba(234,236,241,0.78);
      font-size: 14px;
      line-height: 1.7;
    }
    .next-steps ol li { margin-bottom: 6px; }
    .next-steps strong { color: #fff; }

    .pay-meta {
      margin-top: 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      justify-content: center;
      font-size: 12.5px;
      color: rgba(234,236,241,0.5);
    }
    .pay-meta a {
      color: rgba(234,236,241,0.7);
      text-decoration: underline;
    }
    .pay-meta a:hover { color: #fff; }

    /* ── Plan picker ── */
    .pick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    @media (max-width: 520px) {
      .pick-grid { grid-template-columns: 1fr; }
    }
    .pick-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      background: #171B22;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: border-color 140ms ease, transform 140ms ease, background 140ms ease;
    }
    .pick-card:hover {
      border-color: #2341A8;
      background: #1B212B;
      transform: translateY(-1px);
    }
    .pick-card-head { display: flex; flex-direction: column; gap: 2px; }
    .pick-card-tier {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .pick-card-term {
      font-size: 12px;
      color: rgba(234,236,241,0.55);
    }
    .pick-card-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .pick-card-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: rgba(234,236,241,0.7);
    }
    .pick-card-row strong { color: #fff; font-weight: 600; }
    .pick-card-row .green { color: #4ADE80; font-weight: 600; }
    .pick-card-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #2341A8;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      padding: 11px 16px;
      border-radius: 100px;
    }
    .pick-card:hover .pick-card-cta { background: #1c378f; }
  </style>
</head>
<body>
  <div class="pay-bar">
    <a href="index.html"><img src="assets/backin5-logo-v4.png" alt="BackIn5" /></a>
    <a href="index.html">← Back to site</a>
  </div>

  <main class="pay-wrap" id="pay-wrap">
    <!-- Filled by JS based on ?plan= -->
  </main>

  <script>
    // ─── Plan config ──────────────────────────────────────────────
    // You need 4 Stripe Payment Links. Create them in Stripe, then
    // paste the URLs below. For the 6-month links, apply a 50%-off
    // coupon on the first invoice in Stripe before generating the link.
    const PLANS = {
      tier1: {
        tier: 'On It',
        monthly: 129,
        monthlyFmt: '£129 / month',
        firstMonth6mo: 64.50,
        payLinkMonthly: 'https://buy.stripe.com/cNiaEXgLL1qRdZv5TJ08g04',
        payLink6Month:  'https://buy.stripe.com/7sY28rcvv7Pf3kRbe308g05',
      },
      tier2: {
        tier: 'All Over It',
        monthly: 229,
        monthlyFmt: '£229 / month',
        firstMonth6mo: 114.50,
        payLinkMonthly: 'https://buy.stripe.com/bJe00j2UVglL4oVfuj08g06',
        payLink6Month:  'https://buy.stripe.com/cNi14ndzz2uV1cJ6XN08g07',
      },
    };

    // Backwards-compat aliases (old plan keys + Tally labels)
    PLANS.smart        = PLANS.tier1;
    PLANS.full         = PLANS.tier2;
    PLANS.smart_3mo    = PLANS.tier1;
    PLANS.smart_6mo    = PLANS.tier1;
    PLANS.full_3mo     = PLANS.tier2;
    PLANS.full_6mo     = PLANS.tier2;
    PLANS['on-it']     = PLANS.tier1;
    PLANS['all-over-it'] = PLANS.tier2;

    function detectPlanKey(raw) {
      if (!raw) return null;
      const lc = decodeURIComponent(raw).toLowerCase().trim();
      if (PLANS[lc]) return lc;
      const is1 = lc.includes('tier 1') || lc.includes('tier1')
               || lc.includes('on it')  || lc.includes('on-it')
               || lc.includes('smart')  || lc.includes('129') || lc.includes('199');
      const is2 = lc.includes('tier 2') || lc.includes('tier2')
               || lc.includes('all over it') || lc.includes('all-over-it')
               || lc.includes('full')   || lc.includes('229') || lc.includes('349');
      if (is1) return 'tier1';
      if (is2) return 'tier2';
      return null;
    }

    const params  = new URLSearchParams(window.location.search);
    const planKey = detectPlanKey(params.get('plan'));
    const plan    = planKey ? PLANS[planKey] : null;
    const wrap    = document.getElementById('pay-wrap');

    // ─── No plan param: show picker ──────────────────────────────
    if (!plan) {
      const card = (key, p) => `
        <a class="pick-card" href="payment.html?plan=${key}">
          <div class="pick-card-head">
            <div class="pick-card-tier">${p.tier}</div>
            <div class="pick-card-term">Monthly rolling</div>
          </div>
          <div class="pick-card-body">
            <div class="pick-card-row"><span>Monthly</span><strong>${p.monthlyFmt}</strong></div>
            <div class="pick-card-row"><span>Setup fee</span><span class="green">Waived</span></div>
          </div>
          <span class="pick-card-cta">Continue with this plan →</span>
        </a>`;
      wrap.innerHTML = `
        <div class="pay-eyebrow">Continuing from your trial</div>
        <h1>Which plan would you like?</h1>
        <p class="pay-lead">
          Your setup fee is waived. Monthly billing starts from today.
          Cancel with 30 days written notice after your first month.
        </p>
        <div class="pick-grid">
          ${card('tier1', PLANS.tier1)}
          ${card('tier2', PLANS.tier2)}
        </div>
      `;

    // ─── Plan selected: show confirmation ────────────────────────
    } else {
      wrap.innerHTML = `
        <div class="pay-eyebrow">Continuing from your trial</div>
        <h1>Let's get you set up.</h1>
        <p class="pay-lead">
          You're continuing with <strong>${plan.tier}</strong>.
          Your setup fee is waived. No extra charge today.
        </p>
        <p class="pay-note">
          <strong>Continuing within 24 hours of your trial ending?</strong>
          Your setup fee remains waived. If you're outside that window,
          get in touch at <a href="mailto:hello@backin5.org" style="color:#93A9E7">hello@backin5.org</a> and we'll sort it.
        </p>

        <div class="summary" id="pay-summary">
          <div class="summary-row">
            <span class="label">Plan</span>
            <span class="value">${plan.tier}</span>
          </div>
          <div class="summary-row">
            <span class="label">Setup fee</span>
            <span class="value" style="color:#4ADE80">Waived</span>
          </div>
          <div class="summary-row" id="first-month-row" style="display:none">
            <span class="label">First month (50% off)</span>
            <span class="value" id="first-month-val">-</span>
          </div>
          <div class="summary-row total">
            <span class="label" id="due-label">Monthly</span>
            <span class="value" id="due-val">${plan.monthlyFmt}</span>
          </div>
        </div>

        <div class="commit-box">
          <label class="commit-line">
            <input type="checkbox" id="commit6-check" />
            <span>
              <strong>6-month commitment:</strong> get <strong>50% off your first month</strong>
              (£${plan.firstMonth6mo.toFixed(2)} instead of £${plan.monthly}).
              Full details in the <a href="terms.html" target="_blank" rel="noopener">Terms</a>.
            </span>
          </label>
        </div>

        <div class="commit-box">
          <label class="commit-line">
            <input type="checkbox" id="commit-check" />
            <span>
              I agree to the
              <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a>.
              I understand I can cancel with 30 days' written notice after my first paid month.
            </span>
          </label>
        </div>

        <a class="cta" id="commit-cta" href="${plan.payLinkMonthly}" data-disabled="true">
          Continue: ${plan.monthlyFmt} →
        </a>
        <p class="cta-note">Secured by Stripe. You'll receive a receipt by email.</p>

        <div class="next-steps">
          <h3>What happens next</h3>
          <ol>
            <li>Complete payment. Takes about 30 seconds.</li>
            <li>Your <strong>dashboard stays live</strong>. No further setup needed.</li>
            <li>You'll get a <strong>brief check-in</strong> to make sure everything is running exactly how you want it.</li>
          </ol>
        </div>
      `;

      const check6     = document.getElementById('commit6-check');
      const commitChk  = document.getElementById('commit-check');
      const cta        = document.getElementById('commit-cta');
      const dueVal     = document.getElementById('due-val');
      const dueLabel   = document.getElementById('due-label');
      const firstRow   = document.getElementById('first-month-row');
      const firstVal   = document.getElementById('first-month-val');

      const refreshCta = () => {
        const enabled = commitChk.checked;
        cta.toggleAttribute('data-disabled', !enabled);
        cta.style.opacity       = enabled ? '1'    : '0.5';
        cta.style.pointerEvents = enabled ? 'auto' : 'none';
      };

      const refresh6mo = () => {
        const is6mo = check6.checked;
        if (is6mo) {
          firstRow.style.display = '';
          firstVal.textContent   = `£${plan.firstMonth6mo.toFixed(2)} (then £${plan.monthly}/mo)`;
          dueLabel.textContent   = 'First month';
          dueVal.textContent     = `£${plan.firstMonth6mo.toFixed(2)}`;
          cta.textContent        = `Continue: £${plan.firstMonth6mo.toFixed(2)} today →`;
          cta.href               = plan.payLink6Month;
        } else {
          firstRow.style.display = 'none';
          dueLabel.textContent   = 'Monthly';
          dueVal.textContent     = plan.monthlyFmt;
          cta.textContent        = `Continue: ${plan.monthlyFmt} →`;
          cta.href               = plan.payLinkMonthly;
        }
        refreshCta();
      };

      check6.addEventListener('change', refresh6mo);
      commitChk.addEventListener('change', refreshCta);
      refreshCta();
    }

    // Footer meta (always shown)
    const meta = document.createElement('div');
    meta.className = 'pay-meta';
    meta.innerHTML = `
      <span>Secured by Stripe</span>
      <span>•</span>
      <a href="terms.html" target="_blank" rel="noopener">Terms</a>
      <a href="privacy.html" target="_blank" rel="noopener">Privacy</a>
      <a href="mailto:hello@backin5.org">Contact</a>
    `;
    wrap.appendChild(meta);
  </script>
</body>
</html>
