<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Setup - BackIn5</title>
  <meta name="description" content="Get set up with BackIn5 - tell us about your business and we'll have you live within 24 hours." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0E1116;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* Use the full available viewport, fall back to vh */
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .setup-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1B212B;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .setup-bar a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .setup-bar a:hover { color: #fff; }
    .setup-bar img { height: 22px; width: auto; display: block; }
    .setup-back { font-size: 13px; }
    .tally-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      background: #fff;
      overflow: hidden;
    }
    .tally-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    @media (max-width: 600px) {
      .setup-bar { padding: 10px 14px; }
      .setup-bar img { height: 20px; }
      .setup-back { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="setup-bar">
    <a href="index.html"><img src="assets/backin5-logo-v4.png" alt="BackIn5" /></a>
    <a href="index.html" class="setup-back">← Back to site</a>
  </div>
  <div class="tally-wrap">
    <iframe
      data-tally-src="https://tally.so/embed/pbvz9y?alignLeft=1&hideTitle=0&transparentBackground=0&dynamicHeight=0"
      title="BackIn5 Setup Form"
      allow="clipboard-write"
      loading="lazy"
      width="100%"
      height="100%"
      frameborder="0">
    </iframe>
  </div>
  <script>
    var d = document,
        w = "https://tally.so/widgets/embed.js",
        v = function () {
          if (typeof Tally !== "undefined") {
            Tally.loadEmbeds();
          } else {
            d.querySelectorAll("iframe[data-tally-src]:not([src=''])").forEach(function (e) {
              e.src = e.dataset.tallySrc;
            });
          }
        };
    if (typeof Tally !== "undefined") {
      v();
    } else if (d.querySelector('script[src="' + w + '"]') == null) {
      var s = d.createElement("script");
      s.src = w;
      s.onload = v;
      s.onerror = v;
      d.body.appendChild(s);
    }
  </script>
</body>
</html>
